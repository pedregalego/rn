<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>人类.EXE — 多人脸扫描仪</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
        --bg-color: #0a0a0f;
        --terminal-green: #00ff88;
        --amber: #ffaa00;
        --red: #ff3355;
        --purple: #a78bfa;
        --scan-color: #00ffcc;
        --font-mono: 'Courier New', 'Noto Sans SC', 'Microsoft YaHei', 'PingFang SC', monospace;
        --glass-bg: rgba(10, 15, 22, 0.78);
        --glass-border: rgba(0, 255, 136, 0.25);
    }

    html, body {
        height: 100%; width: 100%;
        font-family: var(--font-mono);
        background: var(--bg-color);
        color: var(--terminal-green);
        overflow: hidden;
        overscroll-behavior: none;
    }

    #videoElement {
        position: fixed; inset: 0;
        width: 100%; height: 100%;
        object-fit: cover;
        z-index: 1;
        transform: translateZ(0);
    }
    #hudCanvas {
        position: fixed; inset: 0;
        width: 100%; height: 100%;
        pointer-events: none;
        z-index: 3;
    }
    #dossierLayer {
        position: fixed; inset: 0;
        pointer-events: none;
        z-index: 4;
        overflow: hidden;
    }

    /* 扫描覆盖层 */
    .scanner-overlay { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
    .scanline {
        position: absolute; width: 100%; height: 3px;
        background: linear-gradient(90deg, transparent, rgba(0, 255, 136, 0.5), transparent);
        animation: scan 5s linear infinite;
    }
    @keyframes scan { 0% { top: 0; opacity: 0; } 10% { opacity: 0.4; } 90% { opacity: 0.4; } 100% { top: 100%; opacity: 0; } }
    .noise {
        position: absolute; inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence baseFrequency='0.9' type='fractalNoise'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        opacity: 0.04;
    }
    .vignette { position: absolute; inset: 0; background: radial-gradient(transparent 55%, rgba(0,0,0,0.55) 100%); }

    /* ============================================================ *
     * 卡片 - 锚定在脸部上方，随人脸移动                              *
     * ============================================================ */
    .face-card {
        position: absolute;
        min-width: 170px;
        max-width: 230px;
        background: var(--glass-bg);
        backdrop-filter: blur(14px) saturate(140%);
        -webkit-backdrop-filter: blur(14px) saturate(140%);
        border: 1px solid var(--glass-border);
        border-left: 3px solid var(--scan-color);
        border-radius: 6px;
        color: var(--terminal-green);
        font-size: 0.72rem;
        line-height: 1.5;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        opacity: 0;
        transform: translate(-50%, -100%) scale(0.9);
        transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.34,1.56,0.64,1),
                    border-color 0.3s, background 0.3s;
        pointer-events: auto;
        cursor: pointer;
        touch-action: manipulation;
        will-change: transform, left, top, opacity;
    }
    .face-card.visible { opacity: 1; transform: translate(-50%, -100%) scale(1); }
    .face-card.confirmed {
        border-left-color: var(--terminal-green);
        background: rgba(0, 30, 20, 0.85);
        transform: translate(-50%, -100%) scale(0.85);
        opacity: 0.9;
    }
    .face-card.rejected { border-left-color: var(--red); opacity: 0.5; }

    /* 四角标记 */
    .face-card::before, .face-card::after {
        content: ''; position: absolute; width: 10px; height: 10px;
        border: 2px solid var(--scan-color); pointer-events: none;
        transition: border-color 0.3s;
    }
    .face-card::before { top: -2px; left: -2px; border-right: none; border-bottom: none; border-radius: 4px 0 0 0; }
    .face-card::after { bottom: -2px; right: -2px; border-left: none; border-top: none; border-radius: 0 0 4px 0; }
    .face-card.confirmed::before, .face-card.confirmed::after { border-color: var(--terminal-green); }
    .face-card.rejected::before, .face-card.rejected::after { border-color: var(--red); }

    .card-header {
        display: flex; justify-content: space-between; align-items: center;
        padding: 5px 9px 4px;
        border-bottom: 1px solid rgba(0, 255, 136, 0.18);
    }
    .card-id {
        font-size: 0.7rem; letter-spacing: 1.5px;
        color: var(--scan-color);
        text-shadow: 0 0 8px rgba(0, 255, 204, 0.5);
    }
    .card-status {
        font-size: 0.55rem; padding: 2px 6px;
        border: 1px solid var(--glass-border);
        border-radius: 99px;
        letter-spacing: 1px; white-space: nowrap;
        color: var(--scan-color);
    }
    .card-status.scanning { color: var(--scan-color); animation: pulse 1.2s ease-in-out infinite; }
    .card-status.pending { color: var(--amber); border-color: rgba(255,170,0,0.4); animation: pulse 1.4s ease-in-out infinite; }
    .card-status.confirmed { color: var(--terminal-green); border-color: rgba(0,255,136,0.5); animation: none; }
    .card-status.rejected { color: var(--red); border-color: rgba(255,51,85,0.5); animation: none; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

    .card-body { padding: 5px 9px 6px; font-size: 0.68rem; min-height: 18px; }
    .card-body .term-line {
        color: var(--scan-color); opacity: 0.9;
        margin: 2px 0;
        font-size: 0.64rem;
        letter-spacing: 0.3px;
    }
    .card-body .term-line.ok { color: var(--terminal-green); }
    .card-body .term-line.warn { color: var(--amber); }
    .card-body .term-line .cursor {
        display: inline-block; width: 6px; height: 0.85em;
        background: var(--scan-color); vertical-align: middle;
        margin-left: 2px; animation: blink 0.7s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* 最终昵称展示 */
    .card-nickname {
        text-align: center;
        padding: 6px 4px;
        font-size: 1.15rem;
        letter-spacing: 3px;
        color: var(--terminal-green);
        text-shadow: 0 0 12px var(--terminal-green), 0 0 24px rgba(0,255,136,0.4);
        font-weight: 500;
    }
    .card-nickname-label {
        display: block;
        font-size: 0.5rem;
        color: #888;
        letter-spacing: 3px;
        margin-bottom: 2px;
        text-shadow: none;
        font-weight: normal;
    }

    /* 确认提示 */
    .card-hint {
        text-align: center;
        font-size: 0.6rem;
        color: var(--amber);
        padding: 4px 0 6px;
        letter-spacing: 2px;
        animation: pulse 1.4s ease-in-out infinite;
        border-top: 1px dashed rgba(255, 170, 0, 0.3);
        margin-top: 3px;
    }
    .card-hint::before { content: '▸ '; }

    /* 索引代码 */
    .card-code {
        text-align: center;
        font-size: 0.55rem;
        color: var(--purple);
        letter-spacing: 2px;
        padding: 2px 0 4px;
        border-top: 1px dashed rgba(167, 139, 250, 0.25);
        margin-top: 2px;
    }

    /* 进度条 */
    .stabilization-bar {
        position: absolute; bottom: 0; left: 0;
        height: 2px; width: 0%;
        background: linear-gradient(90deg, var(--scan-color), var(--terminal-green));
        transition: width 0.2s linear;
        border-radius: 0 0 0 6px;
    }

    /* 卡片锁定动画 */
    @keyframes lockPulse {
        0% { box-shadow: 0 0 0 0 rgba(0, 255, 136, 0.7); }
        100% { box-shadow: 0 0 0 20px rgba(0, 255, 136, 0); }
    }
    .face-card.locking { animation: lockPulse 0.6s ease-out; }

    /* ---------- 启动屏 ---------- */
    .splash-screen {
        position: fixed; inset: 0;
        background: var(--bg-color);
        color: var(--terminal-green);
        display: flex; flex-direction: column;
        justify-content: center; align-items: center;
        text-align: center; padding: 24px;
        z-index: 1000;
        transition: opacity 0.5s ease, visibility 0.5s;
    }
    .splash-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .splash-logo {
        font-size: 3rem; font-weight: bold; letter-spacing: 8px;
        color: var(--amber); text-shadow: 0 0 20px var(--amber);
        margin-bottom: 14px;
    }
    .splash-screen h1 { font-size: 1rem; margin-bottom: 10px; color: var(--scan-color); letter-spacing: 3px; }
    .splash-screen p { font-size: 0.82rem; color: #aaa; max-width: 520px; line-height: 1.7; }
    .splash-screen .loading {
        margin-top: 18px; color: var(--scan-color);
        font-size: 0.82rem; min-height: 1.2em;
        letter-spacing: 1px;
    }

    /* ---------- 状态栏 ---------- */
    .status-bar {
        position: fixed; bottom: 0; left: 0; right: 0;
        background: rgba(10, 10, 15, 0.85);
        border-top: 1px solid var(--glass-border);
        padding: 8px 12px;
        display: flex; justify-content: space-between; align-items: center;
        z-index: 50;
        backdrop-filter: blur(8px);
        gap: 8px; flex-wrap: wrap;
        padding-bottom: calc(8px + env(safe-area-inset-bottom));
    }
    .status-left, .status-right { display: flex; align-items: center; gap: 8px; }
    .indicator-dot {
        width: 9px; height: 9px; border-radius: 50%;
        border: 1px solid currentColor; flex-shrink: 0;
    }
    .indicator-detalhes { color: var(--terminal-green); background-color: var(--terminal-green); box-shadow: 0 0 8px var(--terminal-green); }
    .indicator-alerta { color: var(--amber); background-color: var(--amber); box-shadow: 0 0 8px var(--amber); }
    .indicator-perigo { color: var(--red); background-color: var(--red); box-shadow: 0 0 8px var(--red); }
    .status-text { font-size: 0.72rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45vw; letter-spacing: 1px; }
    .status-text.alerta { color: var(--amber); }
    .status-text.perigo { color: var(--red); }

    .controls { display: flex; gap: 5px; flex-wrap: wrap; }
    .btn {
        background: rgba(0, 255, 136, 0.08);
        border: 1px solid var(--glass-border);
        color: var(--terminal-green);
        padding: 7px 10px;
        font-family: inherit;
        font-size: 0.68rem;
        cursor: pointer;
        border-radius: 3px;
        transition: all 0.15s ease;
        letter-spacing: 1px;
        touch-action: manipulation;
    }
    .btn:active { background: rgba(0, 255, 136, 0.25); }
    .btn.danger { border-color: rgba(255, 51, 85, 0.5); color: var(--red); }
    .btn.danger:active { background: rgba(255, 51, 85, 0.25); }
    .btn.active { background: rgba(0, 255, 136, 0.3); }

    /* ---------- 侧边栏 ---------- */
    .side-panel {
        position: fixed; top: 0; right: -360px;
        width: 340px; max-width: 92%; height: 100vh;
        background: linear-gradient(to bottom, #0a0a0f, #040608);
        border-left: 1px solid var(--glass-border);
        padding: 16px; padding-top: calc(16px + env(safe-area-inset-top));
        padding-bottom: calc(16px + env(safe-area-inset-bottom));
        overflow-y: auto;
        transition: right 0.5s cubic-bezier(0.77, 0, 0.07, 1);
        z-index: 60;
        backdrop-filter: blur(12px);
        display: flex; flex-direction: column; gap: 12px;
    }
    .side-panel.open { right: 0; }
    .panel-header {
        display: flex; justify-content: space-between; align-items: center;
        border-bottom: 1px solid var(--glass-border);
        padding-bottom: 10px;
    }
    .panel-header h2 { font-size: 0.9rem; color: var(--amber); letter-spacing: 2px; }
    .panel-header button { background: transparent; border: none; color: var(--terminal-green); font-size: 1.3rem; cursor: pointer; padding: 4px 8px; }

    .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .metric-box {
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid var(--glass-border);
        border-radius: 5px;
        padding: 8px; text-align: center;
    }
    .metric-box .num { display: block; font-size: 1.3rem; color: var(--amber); }
    .metric-box .lbl { font-size: 0.58rem; color: #7aa392; letter-spacing: 1px; }

    .historico { flex: 1; overflow-y: auto; min-height: 100px; }
    .historico strong { display: block; margin-bottom: 6px; color: var(--amber); font-size: 0.72rem; letter-spacing: 2px; }
    .historico ul { list-style: none; }
    .historico li {
        padding: 7px 8px; border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 4px; font-size: 0.72rem;
        display: flex; justify-content: space-between; align-items: center;
        gap: 6px; margin-bottom: 5px;
    }
    .historico li .codigo {
        color: var(--purple); font-weight: bold;
        background: rgba(167, 139, 250, 0.15); padding: 1px 5px; border-radius: 2px;
        letter-spacing: 1px; flex-shrink: 0;
        font-size: 0.62rem;
    }
    .historico li .nome { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; color: var(--terminal-green); letter-spacing: 2px; }
    .historico .del-btn { color: var(--red); background: none; border: none; cursor: pointer; font-family: inherit; font-size: 1rem; padding: 0 4px; }

    .disclaimer {
        position: fixed; bottom: 58px; left: 0; right: 0;
        text-align: center; font-size: 0.58rem; color: #666;
        z-index: 48; pointer-events: none; padding: 0 8px;
        letter-spacing: 0.5px;
    }

    /* 密度警告 */
    .density-warning {
        position: fixed; top: calc(8px + env(safe-area-inset-top)); left: 50%;
        transform: translateX(-50%) translateY(-100%);
        background: rgba(255, 170, 0, 0.15);
        border: 1px solid rgba(255, 170, 0, 0.5);
        color: var(--amber);
        padding: 5px 12px; border-radius: 4px;
        font-size: 0.65rem; letter-spacing: 2px;
        z-index: 55;
        transition: transform 0.4s ease;
        pointer-events: none;
    }
    .density-warning.visible { transform: translateX(-50%) translateY(0); }

    @media (max-width: 500px) {
        .face-card { min-width: 145px; max-width: 180px; font-size: 0.66rem; }
        .card-nickname { font-size: 1rem; letter-spacing: 2px; }
        .splash-logo { font-size: 2.2rem; }
        .status-text { font-size: 0.62rem; max-width: 40vw; }
        .btn { padding: 6px 8px; font-size: 0.62rem; }
    }
</style>
</head>
<body>

<div class="splash-screen" id="splashScreen">
    <div class="splash-logo">人类.EXE</div>
    <h1>多人脸扫描仪 · 增强现实界面</h1>
    <p>实时检测和索引多张人脸。所有档案均为合成、虚构数据。不识别真实身份。</p>
    <div class="loading" id="loadingText">等待激活...</div>
    <button class="btn" id="startButton" style="margin-top: 18px; padding: 12px 26px; font-size: 0.95rem;">▶ 激活后置摄像头</button>
</div>

<div class="disclaimer">交互模拟 — 所有档案均为虚构。不收集或传输任何真实数据。</div>

<video id="videoElement" autoplay playsinline muted></video>
<canvas id="hudCanvas"></canvas>
<div id="dossierLayer"></div>

<div class="scanner-overlay">
    <div class="scanline"></div>
    <div class="noise"></div>
    <div class="vignette"></div>
</div>

<div class="density-warning" id="densityWarning">⚠ 已达到最大跟踪密度</div>

<div class="status-bar">
    <div class="status-left">
        <div id="indicatorDot" class="indicator-dot indicator-detalhes"></div>
        <span id="statusText" class="status-text">等待激活</span>
    </div>
    <div class="status-right">
        <div class="controls">
            <button class="btn" id="togglePauseBtn">暂停</button>
            <button class="btn" id="switchCameraBtn">切换</button>
            <button class="btn danger" id="stopCameraBtn">关闭</button>
        </div>
        <button class="btn" id="sidePanelToggle">记录</button>
    </div>
</div>

<div class="side-panel" id="sidePanel">
    <div class="panel-header">
        <h2>会话索引</h2>
        <button id="closePanelBtn">×</button>
    </div>
    <div class="metrics-grid">
        <div class="metric-box"><span class="num" id="detecoesCount">0</span><span class="lbl">检测次数</span></div>
        <div class="metric-box"><span class="num" id="registrosCount">0</span><span class="lbl">已索引</span></div>
        <div class="metric-box"><span class="num" id="trackedCount">0</span><span class="lbl">跟踪中</span></div>
        <div class="metric-box"><span class="num" id="pendingCount">0</span><span class="lbl">等待确认</span></div>
    </div>
    <div class="historico">
        <strong>已确认档案</strong>
        <ul id="historicoLista"></ul>
    </div>
    <button class="btn" id="exportarBtn" style="width:100%;">⬇ 导出报告 (.json)</button>
    <button class="btn danger" id="limparSessaoBtn" style="width:100%;">✕ 清除会话</button>
</div>

<script type="module">
import { FaceDetector, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const humano = (() => {
    /* ===================== 配置 ===================== */
    const CFG = {
        stabilizationMs: 900,       // 生成档案前的稳定时间
        trackExpiryMs: 2000,        // 未看到后轨道存活时间
        confirmedHoldMs: 3000,      // 确认后失去人脸仍保留时间
        assocDistFactor: 0.7,       // 关联距离因子
        assocIouThreshold: 0.12,    // IoU 阈值
        maxTracks: 12,              // 最多同时跟踪的人脸
        detectInterval: 80,         // 检测间隔 ms
        typeSpeed: 22,              // 打字速度 ms/字符
        typeSpeedFast: 8
    };

    const state = {
        cameraAtiva: false,
        pausado: false,
        facingMode: { ideal: 'environment' },
        detectionCount: 0,
        recordCount: 0,
        tracks: [],
        trackIdCounter: 0,
        sessionRecords: [],
        indexCounter: 0,
        detectorReady: false,
        loopRunning: false,
        lastFrameTime: 0,
        pendingDecisions: 0,
        densityWarned: false
    };

    const el = {
        splashScreen: document.getElementById('splashScreen'),
        startButton: document.getElementById('startButton'),
        loadingText: document.getElementById('loadingText'),
        statusText: document.getElementById('statusText'),
        indicatorDot: document.getElementById('indicatorDot'),
        detecoesCount: document.getElementById('detecoesCount'),
        registrosCount: document.getElementById('registrosCount'),
        trackedCount: document.getElementById('trackedCount'),
        pendingCount: document.getElementById('pendingCount'),
        historicoLista: document.getElementById('historicoLista'),
        togglePauseBtn: document.getElementById('togglePauseBtn'),
        switchCameraBtn: document.getElementById('switchCameraBtn'),
        stopCameraBtn: document.getElementById('stopCameraBtn'),
        sidePanelToggle: document.getElementById('sidePanelToggle'),
        sidePanel: document.getElementById('sidePanel'),
        closePanelBtn: document.getElementById('closePanelBtn'),
        exportarBtn: document.getElementById('exportarBtn'),
        limparSessaoBtn: document.getElementById('limparSessaoBtn'),
        dossierLayer: document.getElementById('dossierLayer'),
        densityWarning: document.getElementById('densityWarning'),
        video: document.getElementById('videoElement'),
        canvas: document.getElementById('hudCanvas')
    };

    const video = el.video;
    const canvas = el.canvas;
    const ctx = canvas.getContext('2d');

    let faceDetector = null;
    let currentStream = null;
    let rafId = null;

    /* ===================== 中文昵称池 ===================== */
    const APELIDOS = [
        "行者", "影客", "夜巡", "云游", "默观", "孤鸿", "星尘", "雪原",
        "临风", "观澜", "沉舟", "寒江", "无相", "见山", "听雨", "守夜",
        "问天", "观复", "空谷", "明镜", "静水", "流沙", "浮生", "长歌",
        "雪隐", "风语", "尘缘", "月影", "墨客", "青衫"
    ];

    /* ===================== 中文扫描序列 ===================== */
    const SCAN_SEQUENCE = [
        "检测到人脸信号",
        "分析轮廓中…",
        "稳定视觉轨迹…",
        "查询合成矩阵…",
        "生成临时标识…",
        "等待操作员确认"
    ];

    const rand = arr => arr[Math.floor(Math.random() * arr.length)];
    const randInt = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
    const randHex = len => { let s = ''; const c = 'ABCDEF0123456789'; for (let i = 0; i < len; i++) s += c[Math.floor(Math.random() * c.length)]; return s; };

    /* 每个轨道唯一的中文昵称 */
    function gerarApelidoUnico() {
        const usados = new Set(state.tracks.map(t => t.apelido).filter(Boolean));
        const disponiveis = APELIDOS.filter(a => !usados.has(a));
        if (disponiveis.length > 0) return rand(disponiveis);
        // fallback: 加数字后缀
        return rand(APELIDOS) + "-" + randInt(10, 99);
    }

    function gerarCodigoIndice() {
        state.indexCounter++;
        const letras = 'KIHGFEDCBA';
        const idx = Math.floor((state.indexCounter - 1) / 9);
        const letra = letras[Math.min(idx, letras.length - 1)];
        const num = ((state.indexCounter - 1) % 9) + 1;
        return `${letra}${num}`;
    }

    /* ===================== 初始化 ===================== */
    function init() {
        el.startButton.addEventListener('click', iniciarSistema);
        el.togglePauseBtn.addEventListener('click', alternarPausa);
        el.switchCameraBtn.addEventListener('click', alternarCamera);
        el.stopCameraBtn.addEventListener('click', encerrarCamera);
        el.sidePanelToggle.addEventListener('click', abrirPainel);
        el.closePanelBtn.addEventListener('click', fecharPainel);
        el.exportarBtn.addEventListener('click', exportarRelatorio);
        el.limparSessaoBtn.addEventListener('click', limparSessao);
        window.addEventListener('resize', ajustarCanvas);
        window.addEventListener('orientationchange', () => setTimeout(ajustarCanvas, 150));
        carregarHistorico();
    }

    async function iniciarSistema() {
        el.startButton.disabled = true;
        el.startButton.textContent = '⏳ 加载中...';
        el.loadingText.textContent = '正在加载人脸检测模型…';

        try {
            const vision = await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
            );
            el.loadingText.textContent = 'WASM 模型已加载。初始化检测器…';

            faceDetector = await FaceDetector.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite",
                    delegate: "GPU"
                },
                runningMode: "VIDEO",
                minDetectionConfidence: 0.45,
                maxNumFaces: 12
            });

            state.detectorReady = true;
            el.loadingText.textContent = '检测器就绪。正在启动后置摄像头…';
            await iniciarCamera();
            el.splashScreen.classList.add('hidden');
            ajustarCanvas();
            iniciarLoop();
        } catch (e) {
            console.error("初始化错误:", e);
            el.loadingText.textContent = '❌ 错误: ' + e.message;
            el.startButton.disabled = false;
            el.startButton.textContent = '↻ 重试';
            atualizarStatus("错误: " + e.message, 'perigo');
        }
    }

    async function iniciarCamera() {
        if (currentStream) {
            currentStream.getTracks().forEach(t => t.stop());
            currentStream = null;
        }
        const constraints = {
            video: {
                facingMode: state.facingMode,
                width: { ideal: 640 },
                height: { ideal: 480 }
            },
            audio: false
        };
        try {
            currentStream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = currentStream;
            await new Promise(resolve => {
                if (video.readyState >= 2) resolve();
                else video.onloadedmetadata = () => resolve();
            });
            await video.play();
            state.cameraAtiva = true;
            atualizarStatus("正在检测多张人脸…", 'detalhes');
        } catch (err) {
            throw new Error("摄像头不可用: " + err.message);
        }
    }

    function ajustarCanvas() {
        const w = video.videoWidth || 640;
        const h = video.videoHeight || 480;
        canvas.width = w;
        canvas.height = h;
        requestAnimationFrame(renderLoop);
    }

    /* ===================== 主循环 ===================== */
    function iniciarLoop() {
        if (state.loopRunning) return;
        state.loopRunning = true;
        const tick = () => {
            rafId = requestAnimationFrame(tick);
            if (!state.cameraAtiva) return;

            const now = performance.now();
            if (!state.pausado && now - state.lastFrameTime > CFG.detectInterval && video.readyState >= 2 && faceDetector) {
                state.lastFrameTime = now;
                try {
                    const results = faceDetector.detectForVideo(video, now);
                    processarDeteccoes(results.detections || []);
                } catch (e) { /* silent */ }
            }
            updateTracks();
            renderLoop();
        };
        rafId = requestAnimationFrame(tick);
    }

    /* ===================== 跟踪 ===================== */
    function iou(a, b) {
        const x1 = Math.max(a.x, b.x);
        const y1 = Math.max(a.y, b.y);
        const x2 = Math.min(a.x + a.w, b.x + b.w);
        const y2 = Math.min(a.y + a.h, b.y + b.h);
        const iw = Math.max(0, x2 - x1);
        const ih = Math.max(0, y2 - y1);
        const inter = iw * ih;
        const union = a.w * a.h + b.w * b.h - inter;
        return union > 0 ? inter / union : 0;
    }

    function processarDeteccoes(detections) {
        const now = Date.now();
        state.detectionCount += detections.length;
        state.tracks.forEach(t => t.seenThisFrame = false);

        const novas = detections.map(d => ({
            x: d.boundingBox.originX,
            y: d.boundingBox.originY,
            w: d.boundingBox.width,
            h: d.boundingBox.height,
            cx: d.boundingBox.originX + d.boundingBox.width / 2,
            cy: d.boundingBox.originY + d.boundingBox.height / 2
        }));

        const usadas = new Set();
        novas.forEach(det => {
            let best = null, bestScore = -Infinity;
            state.tracks.forEach(t => {
                if (usadas.has(t.id)) return;
                const dist = Math.hypot(t.cx - det.cx, t.cy - det.cy);
                const sizeRef = Math.max(t.w, t.h, det.w, det.h) * 2;
                const distOk = dist < sizeRef * CFG.assocDistFactor;
                const overlap = iou(t.box(), det);
                const overlapOk = overlap > CFG.assocIouThreshold;
                if (!distOk && !overlapOk) return;
                const score = overlap * 2 - (dist / sizeRef);
                if (score > bestScore) { bestScore = score; best = t; }
            });
            if (best) {
                best.updateFromDetection(det);
                best.seenThisFrame = true;
                usadas.add(best.id);
            } else {
                if (state.tracks.length >= CFG.maxTracks) return;
                const newTrack = criarTrack(det);
                state.tracks.push(newTrack);
                usadas.add(newTrack.id);
                if (!state.densityWarned && state.tracks.length >= CFG.maxTracks - 1) {
                    mostrarAvisoDensidade();
                }
            }
        });

        state.tracks.forEach(t => {
            if (t.seenThisFrame) t.lastSeen = now;
        });

        // 移除过期轨道
        state.tracks = state.tracks.filter(t => {
            const holdMs = t.state === 'confirmed' ? CFG.confirmedHoldMs : CFG.trackExpiryMs;
            const expirado = now - t.lastSeen > holdMs;
            if (expirado) {
                removerCard(t);
                return false;
            }
            return true;
        });

        atualizarMetricas();
        atualizarStatusPorEstado();
    }

    function criarTrack(det) {
        state.trackIdCounter++;
        const id = state.trackIdCounter;
        const track = {
            id,
            code: `FACE-${String(id).padStart(3, '0')}`,
            x: det.x, y: det.y, w: det.w, h: det.h,
            cx: det.cx, cy: det.cy,
            createdAt: Date.now(),
            lastSeen: Date.now(),
            stabilized: false,
            state: 'scanning',
            stateChangedAt: Date.now(),
            apelido: null,
            codigo: null,
            card: null,
            cardEls: null,
            scanLineIdx: 0,
            typewriterTimer: null,
            seenThisFrame: true,
            box() { return { x: this.x, y: this.y, w: this.w, h: this.h }; },
            updateFromDetection(d) {
                this.x = this.x * 0.55 + d.x * 0.45;
                this.y = this.y * 0.55 + d.y * 0.45;
                this.w = this.w * 0.55 + d.w * 0.45;
                this.h = this.h * 0.55 + d.h * 0.45;
                this.cx = this.x + this.w / 2;
                this.cy = this.y + this.h / 2;
            }
        };
        criarCard(track);
        return track;
    }

    function updateTracks() {
        const now = Date.now();
        state.tracks.forEach(t => {
            if (!t.stabilized && t.state === 'scanning' && now - t.createdAt > CFG.stabilizationMs) {
                t.stabilized = true;
                iniciarFicha(t);
            }
        });
    }

    /* ===================== 卡片（锚定在脸上方）===================== */
    function criarCard(track) {
        const card = document.createElement('div');
        card.className = 'face-card';
        card.dataset.trackId = track.id;

        card.innerHTML = `
            <div class="card-header">
                <span class="card-id">${track.code}</span>
                <span class="card-status scanning">扫描</span>
            </div>
            <div class="card-body">
                <div class="card-terminal"></div>
                <div class="card-nickname-wrap"></div>
                <div class="card-code-wrap"></div>
                <div class="card-hint-wrap"></div>
            </div>
            <div class="stabilization-bar"></div>
        `;
        el.dossierLayer.appendChild(card);
        track.card = card;
        track.cardEls = {
            status: card.querySelector('.card-status'),
            terminal: card.querySelector('.card-terminal'),
            nicknameWrap: card.querySelector('.card-nickname-wrap'),
            codeWrap: card.querySelector('.card-code-wrap'),
            hintWrap: card.querySelector('.card-hint-wrap'),
            bar: card.querySelector('.stabilization-bar')
        };

        // 点击卡片任何位置 → 确认
        card.addEventListener('click', (e) => {
            e.stopPropagation();
            if (track.state === 'pending') {
                confirmarTrack(track);
            }
        });

        requestAnimationFrame(() => card.classList.add('visible'));
    }

    function removerCard(track) {
        if (track.typewriterTimer) clearTimeout(track.typewriterTimer);
        if (track.card) {
            track.card.style.transition = 'opacity 0.4s ease, transform 0.4s ease';
            track.card.style.opacity = '0';
            track.card.style.transform = 'translate(-50%, -120%) scale(0.85)';
            const card = track.card;
            setTimeout(() => card.remove(), 450);
        }
    }

    /* ===================== 档案生成 ===================== */
    function iniciarFicha(track) {
        if (track.state !== 'scanning') return;
        track.state = 'pending';
        track.stateChangedAt = Date.now();
        track.apelido = gerarApelidoUnico();
        track.codigo = gerarCodigoIndice();

        const els = track.cardEls;
        els.status.textContent = '处理中';
        els.status.classList.remove('scanning');
        els.status.classList.add('pending');
        els.bar.style.width = '100%';

        track.scanLineIdx = 0;
        digitarProximaLinha(track);
    }

    function digitarProximaLinha(track) {
        if (!track.card || track.state === 'confirmed') return;
        const seq = SCAN_SEQUENCE;
        if (track.scanLineIdx >= seq.length) {
            finalizarFicha(track);
            return;
        }
        const texto = seq[track.scanLineIdx];
        const line = document.createElement('div');
        line.className = 'term-line';
        track.cardEls.terminal.appendChild(line);

        let i = 0;
        const cursor = document.createElement('span');
        cursor.className = 'cursor';
        line.appendChild(cursor);

        const tick = () => {
            if (!track.card || track.state === 'confirmed') return;
            if (i < texto.length) {
                cursor.before(document.createTextNode(texto[i]));
                i++;
                track.typewriterTimer = setTimeout(tick, CFG.typeSpeed + Math.random() * 16);
            } else {
                cursor.remove();
                track.scanLineIdx++;
                track.typewriterTimer = setTimeout(() => digitarProximaLinha(track), 80);
            }
        };
        tick();
    }

    function finalizarFicha(track) {
        if (track.state !== 'pending') return;
        const els = track.cardEls;

        els.status.textContent = '等待确认';

        // 清除打字机区域，显示昵称 + 代码
        els.terminal.innerHTML = '';
        els.nicknameWrap.innerHTML = `
            <div class="card-nickname">
                <span class="card-nickname-label">昵称</span>
                ${track.apelido}
            </div>
        `;
        els.codeWrap.innerHTML = `<div class="card-code">索引 ${track.codigo}</div>`;
        els.hintWrap.innerHTML = `<div class="card-hint">点击卡片确认</div>`;

        state.pendingDecisions++;
        atualizarMetricas();
    }

    function confirmarTrack(track) {
        if (track.state !== 'pending') return;
        track.state = 'confirmed';
        track.stateChangedAt = Date.now();
        track.card.classList.add('confirmed', 'locking');
        setTimeout(() => track.card.classList.remove('locking'), 700);

        const els = track.cardEls;
        els.status.textContent = '已索引';
        els.status.classList.remove('pending');
        els.status.classList.add('confirmed');
        els.hintWrap.innerHTML = '';
        els.codeWrap.innerHTML = `<div class="card-code">✓ 索引 ${track.codigo}</div>`;

        const registroId = `HUM-${String(state.sessionRecords.length + 1).padStart(6, '0')}`;
        const ficha = {
            id: registroId,
            trackCode: track.code,
            apelido: track.apelido,
            codigo: track.codigo,
            dataHora: new Date().toLocaleString('zh-CN'),
            status: "已索引"
        };
        state.sessionRecords.push(ficha);
        state.recordCount = state.sessionRecords.length;
        salvarHistorico();
        renderizarHistorico();

        state.pendingDecisions = Math.max(0, state.pendingDecisions - 1);
        atualizarMetricas();
        atualizarStatusPorEstado();
    }

    /* ===================== 渲染 ===================== */
    function renderLoop() {
        const w = canvas.width, h = canvas.height;
        ctx.clearRect(0, 0, w, h);

        state.tracks.forEach(t => {
            let color, dash;
            if (t.state === 'confirmed') { color = '#00ff88'; dash = [4, 6]; }
            else if (t.state === 'pending') { color = '#ffaa00'; dash = [5, 5]; }
            else { color = '#00ffcc'; dash = [3, 8]; }

            ctx.strokeStyle = color;
            ctx.lineWidth = 1.8;
            ctx.setLineDash(dash);
            ctx.strokeRect(t.x, t.y, t.w, t.h);
            ctx.setLineDash([]);

            ctx.lineWidth = 2;
            ctx.strokeStyle = color;
            const m = Math.min(10, t.w * 0.15, t.h * 0.15);
            ctx.beginPath();
            ctx.moveTo(t.x, t.y + m); ctx.lineTo(t.x, t.y); ctx.lineTo(t.x + m, t.y);
            ctx.moveTo(t.x + t.w - m, t.y); ctx.lineTo(t.x + t.w, t.y); ctx.lineTo(t.x + t.w, t.y + m);
            ctx.moveTo(t.x, t.y + t.h - m); ctx.lineTo(t.x, t.y + t.h); ctx.lineTo(t.x + m, t.y + t.h);
            ctx.moveTo(t.x + t.w - m, t.y + t.h); ctx.lineTo(t.x + t.w, t.y + t.h); ctx.lineTo(t.x + t.w, t.y + t.h - m);
            ctx.stroke();

            ctx.fillStyle = 'rgba(10, 10, 15, 0.8)';
            ctx.fillRect(t.x, t.y - 18, 92, 16);
            ctx.fillStyle = color;
            ctx.font = "600 11px monospace";
            ctx.textAlign = "left";
            ctx.fillText(t.code, t.x + 4, t.y - 6);
        });

        posicionarCards();
    }

    /* 卡片锚定在脸上方 */
    function posicionarCards() {
        const vW = video.clientWidth || window.innerWidth;
        const vH = video.clientHeight || window.innerHeight;
        const cW = canvas.width || 1;
        const cH = canvas.height || 1;
        const scaleX = vW / cW;
        const scaleY = vH / cH;

        const topSafe = 8;

        state.tracks.forEach(t => {
            const card = t.card;
            if (!card) return;
            const cardW = card.offsetWidth || 180;
            const cardH = card.offsetHeight || 90;

            const faceX = t.cx * scaleX;
            const faceY = t.cy * scaleY;
            const faceW = t.w * scaleX;
            const faceH = t.h * scaleY;

            // 卡片中心对齐人脸水平中心
            // 卡片底部位于人脸顶部上方 6px
            let left = faceX;
            let top = (faceY - faceH / 2) - 6;

            // 限制水平范围
            const halfW = cardW / 2;
            if (left - halfW < 4) left = 4 + halfW;
            if (left + halfW > vW - 4) left = vW - 4 - halfW;

            // 限制垂直：如果卡片顶部超出屏幕，翻转到人脸下方
            if (top - cardH < topSafe) {
                // 翻转到下方
                top = (faceY + faceH / 2) + cardH + 6;
                card.style.transform = 'translate(-50%, 0) scale(1)';
                if (t.state === 'confirmed') {
                    card.style.transform = 'translate(-50%, 0) scale(0.85)';
                }
            } else {
                card.style.transform = 'translate(-50%, -100%) scale(1)';
                if (t.state === 'confirmed') {
                    card.style.transform = 'translate(-50%, -100%) scale(0.85)';
                }
            }

            if (top + cardH > vH - 60) top = vH - 60 - cardH;
            if (top < topSafe) top = topSafe;

            card.style.left = left + 'px';
            card.style.top = top + 'px';
        });
    }

    /* ===================== 状态 ===================== */
    function atualizarStatusPorEstado() {
        const active = state.tracks.filter(t => t.state !== 'rejected');
        const pend = state.tracks.filter(t => t.state === 'pending').length;
        const conf = state.tracks.filter(t => t.state === 'confirmed').length;

        if (active.length === 0) {
            atualizarStatus("未检测到人脸", 'detalhes');
        } else if (pend > 0) {
            atualizarStatus(`${pend} 个档案等待确认`, 'alerta');
        } else if (active.length > 1) {
            atualizarStatus(`跟踪 ${active.length} 张人脸 · ${conf} 已索引`, 'alerta');
        } else {
            atualizarStatus(`跟踪 1 张人脸 · ${conf} 已索引`, 'detalhes');
        }
    }

    function atualizarStatus(texto, classe = 'detalhes') {
        el.statusText.textContent = texto;
        el.statusText.className = 'status-text';
        if (classe !== 'detalhes') el.statusText.classList.add(classe);
        el.indicatorDot.className = 'indicator-dot';
        el.indicatorDot.classList.add(`indicator-${classe}`);
    }

    function atualizarMetricas() {
        el.detecoesCount.textContent = state.detectionCount;
        el.registrosCount.textContent = state.recordCount;
        el.trackedCount.textContent = state.tracks.filter(t => t.state !== 'rejected').length;
        el.pendingCount.textContent = state.tracks.filter(t => t.state === 'pending').length;
        if (state.tracks.filter(t => t.state !== 'rejected').length < CFG.maxTracks - 2) {
            state.densityWarned = false;
            el.densityWarning.classList.remove('visible');
        }
    }

    function mostrarAvisoDensidade() {
        state.densityWarned = true;
        el.densityWarning.classList.add('visible');
        setTimeout(() => el.densityWarning.classList.remove('visible'), 3500);
    }

    /* ===================== 控制 ===================== */
    function alternarPausa() {
        if (!state.cameraAtiva) return;
        state.pausado = !state.pausado;
        el.togglePauseBtn.textContent = state.pausado ? "继续" : "暂停";
        el.togglePauseBtn.classList.toggle('active', state.pausado);
        atualizarStatus(state.pausado ? "索引已暂停" : "继续检测…", state.pausado ? 'alerta' : 'detalhes');
    }

    async function alternarCamera() {
        if (!state.cameraAtiva) return;
        state.facingMode = state.facingMode.ideal === 'environment'
            ? { ideal: 'user' }
            : { ideal: 'environment' };
        atualizarStatus("切换摄像头…", 'alerta');
        try {
            await iniciarCamera();
            state.tracks.forEach(t => removerCard(t));
            state.tracks = [];
            state.pendingDecisions = 0;
            atualizarMetricas();
        } catch (e) {
            atualizarStatus("切换摄像头失败", 'perigo');
        }
    }

    function encerrarCamera() {
        if (currentStream) {
            currentStream.getTracks().forEach(t => t.stop());
            currentStream = null;
        }
        video.srcObject = null;
        state.cameraAtiva = false;
        state.pausado = false;
        el.togglePauseBtn.textContent = "暂停";
        el.togglePauseBtn.classList.remove('active');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        state.tracks.forEach(t => removerCard(t));
        state.tracks = [];
        state.pendingDecisions = 0;
        atualizarMetricas();
        atualizarStatus("摄像头已关闭", 'perigo');
    }

    function abrirPainel() { el.sidePanel.classList.add('open'); renderizarHistorico(); }
    function fecharPainel() { el.sidePanel.classList.remove('open'); }

    /* ===================== 持久化 ===================== */
    function salvarHistorico() {
        try { localStorage.setItem('humanoSessionRecords', JSON.stringify(state.sessionRecords)); }
        catch (e) { console.warn(e); }
    }

    function carregarHistorico() {
        try {
            const saved = localStorage.getItem('humanoSessionRecords');
            if (saved) {
                state.sessionRecords = JSON.parse(saved);
                state.recordCount = state.sessionRecords.length;
                if (state.sessionRecords.length > 0) {
                    const ultimo = state.sessionRecords[state.sessionRecords.length - 1];
                    if (ultimo.codigo) {
                        const m = ultimo.codigo.match(/^([A-Z])(\d+)$/);
                        if (m) {
                            const letras = 'KIHGFEDCBA';
                            const letraIdx = letras.indexOf(m[1]);
                            if (letraIdx >= 0) state.indexCounter = letraIdx * 9 + parseInt(m[2], 10);
                        }
                    }
                }
            }
        } catch (e) { console.warn(e); }
        atualizarMetricas();
        renderizarHistorico();
    }

    function renderizarHistorico() {
        el.historicoLista.innerHTML = '';
        if (state.sessionRecords.length === 0) {
            el.historicoLista.innerHTML = '<li style="text-align:center; color:#666; justify-content:center;">暂无索引。</li>';
            return;
        }
        state.sessionRecords.slice().reverse().forEach(record => {
            const li = document.createElement('li');
            const cod = document.createElement('span'); cod.className = 'codigo'; cod.textContent = record.codigo;
            const nome = document.createElement('span'); nome.className = 'nome'; nome.textContent = record.apelido;
            const btn = document.createElement('button'); btn.className = 'del-btn'; btn.textContent = '×';
            btn.addEventListener('click', () => removerRegistro(record.id));
            li.append(cod, nome, btn);
            el.historicoLista.appendChild(li);
        });
    }

    function removerRegistro(id) {
        state.sessionRecords = state.sessionRecords.filter(r => r.id !== id);
        state.recordCount = state.sessionRecords.length;
        salvarHistorico();
        renderizarHistorico();
        atualizarMetricas();
    }

    function limparSessao() {
        if (!confirm("清除整个会话？此操作无法撤销。")) return;
        state.sessionRecords = [];
        state.detectionCount = 0;
        state.recordCount = 0;
        state.indexCounter = 0;
        state.tracks.forEach(t => removerCard(t));
        state.tracks = [];
        state.pendingDecisions = 0;
        localStorage.removeItem('humanoSessionRecords');
        atualizarMetricas();
        renderizarHistorico();
        atualizarStatus("会话已清除", 'detalhes');
    }

    function exportarRelatorio() {
        if (state.sessionRecords.length === 0) { alert("没有记录。"); return; }
        const conteudo = {
            titulo: "人类.EXE — 索引报告",
            descricao: "合成、虚构数据。不代表真实身份。不存储或传输任何图像。",
            timestamp: new Date().toISOString(),
            metricas: {
                检测次数: state.detectionCount,
                已索引: state.recordCount,
                创建轨迹: state.trackIdCounter
            },
            registros: state.sessionRecords
        };
        const blob = new Blob([JSON.stringify(conteudo, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `humano_exe_${new Date().toISOString().slice(0,10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
    }

    return { init };
})();

window.addEventListener('load', () => humano.init());
</script>
